[project]
name = "mantis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tim", email = "tim@guehring.org" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-image>=0.26.0",
]

[project.scripts]
mantis = "mantis:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
